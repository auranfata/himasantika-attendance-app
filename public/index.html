<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Absensi DPO - HIMASANTIKA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Library untuk Export Excel dan PDF (Client-side) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Manifest untuk PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0D006E">
    <link rel="apple-touch-icon" href="/images/hima.png">
</head>
<body>

    <div class="app-container">
        
        <!-- ================= LAYER 1: LOGIN ================= -->
        <div id="view-login" class="view-section active">
            <div class="logo-container">
                <!-- Ganti src dengan link logo HIMASANTIKA Anda -->
                <img src="images/hima.png" alt="Logo HIMASANTIKA" class="logo-img">
            </div>
            <div class="text-center mb-20">
                <h2>Portal DPO HIMASANTIKA</h2>
                <p class="subtitle">Masukkan Username dan Password untuk mengakses Sistem Absensi</p>
            </div>
            
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="login-user" class="form-control" placeholder="Contoh: admin1">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="login-pass" class="form-control" placeholder="****">
            </div>
            <p id="login-error" class="error-msg" style="display: none;"></p>
            <button id="btn-login" class="btn btn-primary w-100 mt-15">Login Sistem</button>
        </div>

        <!-- ================= LAYER 2: DASHBOARD PORTAL ================= -->
        <div id="view-dashboard" class="view-section hidden">
            <div class="logo-container">
                <img src="images/hima.png" alt="Logo HIMASANTIKA" class="logo-img">
            </div>
            <div class="text-center mb-20">
                <h2>Portal Absensi</h2>
                <p class="subtitle">Departemen Pengembangan Organisasi HIMASANTIKA</p>
            </div>
            
            <div class="menu-grid">
                <button id="btn-menu-scanner" class="btn btn-primary w-100 mb-15">
                    <i class="fas fa-qrcode"></i> Buka Scanner Absensi
                </button>
                <button id="btn-menu-rekap" class="btn btn-outline w-100">
                    <i class="fas fa-file-excel"></i> Unduh / Lihat Rekap Data
                </button>
            </div>

            <button id="btn-logout" class="btn btn-text w-100 mt-20 text-danger">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>

        <!-- ================= LAYER 3: SETUP KEGIATAN ================= -->
        <div id="view-setup" class="view-section hidden">
            <div class="nav-header">
                <button class="btn-back" onclick="switchView('view-dashboard')"><i class="fas fa-arrow-left"></i> Kembali</button>
                <h3>Konfigurasi Sesi</h3>
            </div>
            
            <div class="input-group mt-15">
                <label>Pilih Kategori Kegiatan:</label>
                <select id="kategori-kegiatan" class="form-control">
                    <option value="" disabled selected>-- Pilih Kegiatan --</option>
                    <option value="Rapat TRIWULAN III">RAPAT TRIWULAN III</option>
                    <option value="DIESNATALIS 14 HIMASANTIKA">DIESNATALIS 14 HIMASANTIKA</option>
                    <option value="RAPAT KEGIATAN">RAPAT KEGIATAN</option>
                    <option value="Kustom">-- Lainnya (Ketik Manual) --</option>
                </select>
            </div>
            
            <div class="input-group" id="kustom-container" style="display: none;">
                <label>Nama Kegiatan Khusus:</label>
                <input type="text" id="kategori-kustom" class="form-control" placeholder="Contoh: Rapat Divisi Medkom">
            </div>

            <button id="btn-mulai-sesi" class="btn btn-primary w-100 mt-20" disabled>Mulai Scanner</button>
        </div>

        <!-- ================= LAYER 4: SCANNER UTAMA ================= -->
        <div id="view-scanner" class="view-section hidden">
            <div class="top-controls">
                <button class="btn-back" onclick="stopScannerAndBack()"><i class="fas fa-arrow-left"></i></button>
                <span id="label-kegiatan-aktif" class="badge">Kegiatan Aktif</span>
                <div>
                    <button id="btn-ganti-kamera" class="btn btn-icon" title="Balik Kamera"><i class="fas fa-sync-alt"></i></button>
                    <button id="btn-mirror" class="btn btn-icon" title="Efek Cermin"><i class="fas fa-arrows-alt-h"></i></button>
                </div>
            </div>

            <div id="reader-container">
                <div id="reader"></div>
            </div>
            
            <div id="session-info" class="session-badge">Memori Sesi: 0 Hadir</div>
            
            <div class="manual-trigger mt-15">
                <a href="#" id="toggle-manual" class="text-link">Gagal scan? Input Manual</a>
            </div>

            <div id="manual-container" style="display: none;" class="mt-15">
                <div class="flex-input">
                    <input type="text" id="manual-nim" class="form-control" placeholder="Masukkan NIM...">
                    <button onclick="processManualInput()" class="btn btn-primary">Proses</button>
                </div>
            </div>
        </div>

        <!-- ================= LAYER 5: REKAP & EXPORT ================= -->
        <div id="view-rekap" class="view-section hidden" style="max-width: 100%;">
            <div class="nav-header">
                <button class="btn-back" onclick="switchView('view-dashboard')"><i class="fas fa-arrow-left"></i> Kembali</button>
                <h3>Rekapitulasi Kehadiran</h3>
            </div>
            
            <div class="top-controls mb-15">
                <select id="filter-kegiatan" class="form-control" style="width: 60%;">
                    <option value="ALL">Semua Kegiatan</option>
                    <!-- Akan diisi dinamis via JS -->
                </select>
                <div style="display: flex; gap: 10px;">
                    <button onclick="exportExcel()" class="btn btn-success" title="Unduh Excel"><i class="fas fa-file-excel"></i></button>
                    <button onclick="exportPDF()" class="btn btn-danger" title="Unduh PDF"><i class="fas fa-file-pdf"></i></button>
                </div>
            </div>

            <div style="overflow-x: auto; border-radius: 8px; border: 1px solid #ddd;">
                <table id="tabel-rekap" style="width: 100%; border-collapse: collapse; font-size: 0.85rem;">
                    <thead style="background: var(--primary-blue); color: white;">
                        <tr>
                            <th style="padding: 10px;">Waktu Scan</th>
                            <th style="padding: 10px;">NIM</th>
                            <th style="padding: 10px;">Nama</th>
                            <th style="padding: 10px;">Kegiatan</th>
                            <th style="padding: 10px;">Status</th>
                        </tr>
                    </thead>
                    <tbody id="body-rekap">
                        <!-- Data akan di-render di sini -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- POP-UP HASIL (Di luar container agar posisinya absolut di layar) -->
    <div id="result-container" style="display: none;">
        <img id="res-foto" src="" alt="Foto Anggota">
        <h2 id="res-nama">-</h2>
        <p id="res-nim" class="bold-text">-</p>
        <p id="res-divisi">-</p>
        <p id="res-msg" class="italic-text"></p>
    </div>

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="script.js"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('ServiceWorker terdaftar dengan sukses pada scope: ', registration.scope);
            })
            .catch(err => {
              console.log('Pendaftaran ServiceWorker gagal: ', err);
            });
        });
      }
    </script>
</body>
</html>
